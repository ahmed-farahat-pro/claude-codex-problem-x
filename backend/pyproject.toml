[project]
name = "fourweeks-backend"
version = "0.1.0"
description = "4weeks.ai tutor coordinator: sessions, bounded lab tools, retrieval, memory and assessment."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Real model drafts and tutor reasoning (FOURWEEKS_MODE=gemini).
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
